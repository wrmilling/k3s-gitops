---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubewatch-config
  namespace: monitoring
data:
  .kubewatch.yaml: |
    handler:
      webhook:
        enabled: true
        url: "${SECRET_HOOKSHOT_K8S_EVENTS_URL}"
    resource:
      # statefulset isn't a confirmed key in kubewatch's resource schema (unlike
      # Botkube, which watched it explicitly) - verify support and add/remove
      # once the deployed version's docs are checked.
      deployment: true
      replicationcontroller: false
      replicaset: false
      daemonset: true
      services: true
      pod: true
      job: true
      node: false
      clusterrole: true
      clusterrolebinding: true
      serviceaccount: false
      persistentvolume: true
      namespace: true
      secret: true
      configmap: true
      ingress: true
      namespaces:
        - all
