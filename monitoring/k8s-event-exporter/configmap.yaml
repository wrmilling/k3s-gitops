---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-event-exporter-config
  namespace: monitoring
data:
  config.yaml: |
    logLevel: error
    logFormat: json
    kubeQPS: 60
    kubeBurst: 60
    route:
      # Drop the noisiest routine lifecycle reasons; everything else (in
      # particular all Warning-type events: crashloops, OOMKilled, image
      # pull failures, scheduling/probe failures, evictions) is forwarded.
      # Tune this list once running if it's still too chatty or too quiet.
      drop:
        - reason: "^(Pulling|Pulled|Created|Started|Scheduled|SuccessfulCreate|SuccessfulDelete)$"
      routes:
        - match:
            - receiver: "matrix"
    receivers:
      - name: "matrix"
        webhook:
          endpoint: "${SECRET_HOOKSHOT_K8S_EVENTS_URL}"
          # Hookshot's generic webhook renders a top-level "text" key as the
          # Matrix message body (Markdown -> HTML), so reshape the raw event
          # into one short line instead of dumping the full JSON payload.
          layout:
            text: |
              {{ if eq .Type "Warning" }}⚠️{{ else }}ℹ️{{ end }} **{{ .Reason }}** `{{ .InvolvedObject.Kind }}/{{ .InvolvedObject.Namespace }}/{{ .InvolvedObject.Name }}`
              {{ .Message }}{{ if gt .Count 1 }} _(x{{ .Count }})_{{ end }}
