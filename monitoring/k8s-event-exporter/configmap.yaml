---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-event-exporter-config
  namespace: monitoring
data:
  config.yaml: |
    logLevel: error
    logFormat: json
    route:
      # Drop the noisiest routine lifecycle reasons; everything else (in
      # particular all Warning-type events: crashloops, OOMKilled, image
      # pull failures, scheduling/probe failures, evictions) is forwarded.
      # Tune this list once running if it's still too chatty or too quiet.
      drop:
        - reason: "^(Pulling|Pulled|Created|Started|Scheduled|SuccessfulCreate|SuccessfulDelete)$"
      routes:
        - match:
            - receiver: "matrix"
    receivers:
      - name: "matrix"
        webhook:
          endpoint: "${SECRET_HOOKSHOT_K8S_EVENTS_URL}"
          headers:
            Content-Type: "application/json"
