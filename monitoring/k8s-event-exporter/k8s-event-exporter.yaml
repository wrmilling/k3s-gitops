---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-5.0.0/charts/library/common/values.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-event-exporter
  namespace: monitoring
spec:
  releaseName: k8s-event-exporter
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-helm-charts
        namespace: flux-system
      interval: 15m
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      main:
        type: deployment
        replicas: 1
        serviceAccount:
          name: k8s-event-exporter
        containers:
          main:
            # TODO: confirm current maintained image/tag before applying -
            # upstream is opsgenie/kubernetes-event-exporter, GHCR mirror below.
            image:
              repository: ghcr.io/opsgenie/kubernetes-event-exporter
              tag: latest
            args:
              - -conf=/data/config.yaml
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    persistence:
      config:
        type: configMap
        name: k8s-event-exporter-config
        globalMounts:
          - path: /data/config.yaml
            subPath: config.yaml
            readOnly: true
