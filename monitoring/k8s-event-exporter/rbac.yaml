---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-event-exporter
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-event-exporter
rules:
  # Events reference arbitrary involved objects (Pods, Deployments, Flux
  # Kustomizations, ...) which the exporter looks up to enrich events with
  # labels/annotations, so read access is needed cluster-wide.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-event-exporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-event-exporter
subjects:
  - kind: ServiceAccount
    name: k8s-event-exporter
    namespace: monitoring
