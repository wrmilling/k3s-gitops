# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
  namespace: monitoring
spec:
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.91.2
      sourceRef:
        kind: HelmRepository
        name: victoriametrics-charts
        namespace: flux-system
      interval: 2h
  interval: 1h
  install:
    createNamespace: true
  values:
    fullnameOverride: stack

    defaultDashboards:
      enabled: false

    kubeScheduler:
      enabled: false

    kubeControllerManager:
      enabled: false

    kubeEtcd:
      enabled: false

    defaultRules:
      groups:
        kubernetes-system-scheduler:
          enabled: false
        kubernetes-system-controller-manager:
          enabled: false
        etcd:
          enabled: false
        kube-scheduler.rules:
          enabled: false

    vmsingle:
      enabled: true
      spec:
        retentionPeriod: "3"
        replicaCount: 1
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 100Gi
        resources:
          limits:
            memory: 2Gi
          requests:
            cpu: 530m
            memory: 1.2Gi
      ingress:
        enabled: false
      route:
        enabled: true
        labels:
          error-pages: enabled
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        hostnames:
          - vm.k.${SECRET_DOMAIN}

    alertmanager:
      enabled: true
      spec:
        externalURL: "https://vm-alert.${SECRET_DOMAIN}"
        routePrefix: /
      ingress:
        enabled: false
      route:
        enabled: true
        labels:
          error-pages: enabled
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        hostnames:
          - vm-alert.k.${SECRET_DOMAIN}
      config:
        route:
          receiver: "blackhole"
          group_by: ["alertname", "severity"]
          group_wait: 30s
          group_interval: 10m
          repeat_interval: 12h
          routes:
            - matchers:
                - alertname=~"WatchDog|InfoInhibitor|KubeMemoryOvercommit|CephNodeNetworkPacketErrors"
              receiver: "blackhole"
            - matchers:
                - severity = "critical"
                - alertname=~"Host.*|Node.*|Zfs.*|UPS.*|Smartctl.*"
              receiver: "critical-matrix"
              group_by: ["alertname", "instance"]
              group_wait: 10s
              continue: false
            - matchers:
                - severity = "warning"
                - alertname=~"Host.*|Node.*|Zfs.*|UPS.*|Smartctl.*"
              receiver: "warning-matrix"
              group_by: ["alertname", "instance"]
              continue: false
            - matchers:
                - severity = "critical"
                - alertname=~".*Pod.*|.*Container.*|.*Deployment.*|Cert.*|Flux.*|VolSync.*|Envoy.*|PG.*"
              receiver: "critical-matrix"
              group_by: ["alertname", "namespace"]
              group_wait: 10s
              continue: false
            - matchers:
                - severity = "warning"
                - alertname=~".*Pod.*|.*Container.*|.*Deployment.*|Cert.*|Flux.*|VolSync.*|Envoy.*|PG.*"
              receiver: "warning-matrix"
              group_by: ["alertname", "namespace"]
              continue: false
            - matchers:
                - severity = "critical"
              receiver: "critical-matrix"
              group_by: ["alertname"]
              group_wait: 10s
              continue: false
            - matchers:
                - severity = "warning"
              receiver: "warning-matrix"
              group_by: ["alertname"]
              continue: false
        inhibit_rules:
          - source_matchers:
              - severity = "critical"
            target_matchers:
              - severity =~ "warning|info"
            equal: ["namespace", "alertname"]
          - source_matchers:
              - severity = "warning"
            target_matchers:
              - severity = "info"
            equal: ["namespace", "alertname"]
          - source_matchers:
              - alertname = "InfoInhibitor"
            target_matchers:
              - severity = "info"
            equal: ["namespace"]
          - target_matchers:
              - alertname = "InfoInhibitor"
        receivers:
          - name: "blackhole"
          - name: "critical-matrix"
            webhook_configs:
              - url: "${SECRET_HOOKSHOT_CRITICAL_ALERTS_URL}"
                send_resolved: true
          - name: "warning-matrix"
            webhook_configs:
              - url: "${SECRET_HOOKSHOT_WARNING_ALERTS_URL}"
                send_resolved: true

    vmalert:
      enabled: true
      spec:
        extraArgs:
          external.url: "https://vmalert.${SECRET_DOMAIN}"
        evaluationInterval: 15s
      ingress:
        enabled: false
      route:
        enabled: true
        labels:
          error-pages: enabled
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        hostnames:
          - vmalert.k.${SECRET_DOMAIN}

    vmagent:
      enabled: true
      spec:
        scrapeInterval: 20s
        externalLabels:
          cluster: k3s
        extraArgs:
          promscrape.maxScrapeSize: "32MB"
        resources:
          limits:
            cpu: 500m
            memory: 500Mi
          requests:
            cpu: 50m
            memory: 200Mi
      ingress:
        enabled: false
      route:
        enabled: true
        labels:
          error-pages: enabled
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        hostnames:
          - vmagent.k.${SECRET_DOMAIN}

    grafana:
      enabled: false

    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 512Mi

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi

    victoria-metrics-operator:
      resources:
        requests:
          cpu: 10m
          memory: 96Mi
        limits:
          memory: 256Mi
