---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  interval: 5m
  chart:
    spec:
      # renovate: registryUrl=https://charts.rook.io/release
      chart: rook-ceph
      version: v1.20.6
      sourceRef:
        kind: HelmRepository
        name: rook-ceph-charts
        namespace: flux-system
      interval: 5m
  values:
    crds:
      enabled: false
    pspEnable: false
    csi:
      # Rook v1.20: CSI drivers are managed by the ceph-csi-operator. This flag
      # installs the operator subchart; all driver/plugin settings (kubeletDirPath,
      # host networking, plugin tolerations, CephFS enable/disable) now live in the
      # ceph-csi-drivers HelmRelease (rook-ceph/csi/ceph-csi-drivers.yaml).
      installCsiOperator: true
      # Temporary: pin to our own patched image (rook-ceph/csi/cephcsi-patched/)
      # until upstream ceph-csi ships a release bundling a Ceph 20.2.4+ client --
      # see that Dockerfile's header comment for the full reason and revert steps.
      cephcsi:
        repository: git.${SECRET_DOMAIN}/wrmilling/cephcsi-patched
        tag: v3.17.0-ceph20.2.4
    resources:
      limits:
        cpu: 1000m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
    monitoring:
      enabled: true