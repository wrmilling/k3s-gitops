---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-5.0.0/charts/library/common/values.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: calibre
  namespace: media
spec:
  releaseName: calibre
  interval: 15m
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts/
      chart: app-template
      version: 5.1.0
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s-helm-charts
        namespace: flux-system
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      main:
        strategy: Recreate
        containers:
          main:
            image:
              repository: crocodilestick/calibre-web-automated
              pullPolicy: IfNotPresent
              tag: v4.0.6@sha256:c31a738b6d5ec6982c050063dd3f063b6943eb1051fc81144789f840d9093a8d
            env:
              TZ: America/Chicago
              PUID: 1000
              PGID: 1000
            resources:
              requests:
                cpu: 10m
                memory: 192Mi
              limits:
                memory: 512Mi

    service:
      main:
        controller: main
        ports:
          http:
            port: 8083

    route:
      main:
        hostnames:
          - lib.${SECRET_DOMAIN}
        parentRefs:
          - namespace: kube-system
            name: external
            sectionName: https

    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        # runAsUser: 911
        # runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "Always"

    persistence:
      config:
        enabled: true
        existingClaim: calibre-config-pvc
        globalMounts:
          - path: /config
      ingest:
        enabled: true
        existingClaim: nfs-calibre-ingest-pvc
        globalMounts:
          - path: /cwa-book-ingest
      library:
        enabled: true
        existingClaim: calibre-library-pvc
        globalMounts:
          - path: /calibre-library
