---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: synapse
  namespace: social
spec:
  parentRefs:
    - name: external
      namespace: kube-system
      sectionName: https
  hostnames:
    - synapse.${SECRET_DOMAIN}
  rules:
    # MAS compatibility layer: https://element-hq.github.io/matrix-authentication-service/setup/reverse-proxy.html#compatibility-layer
    # Must come before the catch-all rule below since Synapse has native login/logout/refresh disabled (delegated to MAS).
    - matches:
        - path:
            type: RegularExpression
            value: ^/_matrix/client/[^/]+/(login|logout|refresh)(/.*)?$
      backendRefs:
        - name: synapse-matrix-authentication-service
          port: 8080
          kind: Service
          group: ""
    # Hookshot is not routed by Synapse itself; without these rules,
    # /_matrix/hookshot/* falls through to the catch-all below and 404s
    # against Synapse instead of reaching the hookshot bridge.
    - matches:
        - path:
            type: PathPrefix
            value: /_matrix/hookshot/widgetapi
      backendRefs:
        - name: synapse-hookshot
          port: 7778
          kind: Service
          group: ""
    - matches:
        - path:
            type: PathPrefix
            value: /_matrix/hookshot
      backendRefs:
        - name: synapse-hookshot
          port: 7775
          kind: Service
          group: ""
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: synapse-synapse
          port: 8008
          kind: Service
          group: ""
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: synapse-element-admin
  namespace: social
spec:
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: https
  hostnames:
    - madmin.k.${SECRET_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: synapse-element-admin
          port: 8080
          kind: Service
          group: ""
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: synapse-matrix-auth
  namespace: social
spec:
  parentRefs:
    - name: external
      namespace: kube-system
      sectionName: https
  hostnames:
    - mas.${SECRET_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: synapse-matrix-authentication-service
          port: 8080
          kind: Service
          group: ""
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: synapse-element-web
  namespace: social
spec:
  parentRefs:
    - name: external
      namespace: kube-system
      sectionName: https
  hostnames:
    - chat.${SECRET_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: synapse-element-web
          port: 80
          kind: Service
          group: ""
