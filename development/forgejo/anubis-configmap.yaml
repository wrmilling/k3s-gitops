apiVersion: v1
kind: ConfigMap
metadata:
  name: anubis-configmap
  namespace: development
data:
  botPolicy.yaml: |
    bots:
    - name: actions-api
      path_regex: ^/api/.*$
      action: ALLOW
    - name: actions-repos
      path_regex: ^/actions/.*$
      action: ALLOW

    # Matches Gatus by its self-reported UA, not IP/hostname.
    - name: gatus-healthcheck
      expression:
        all:
          - userAgent.startsWith("Gatus/")
          - path == "/"
      action: ALLOW

    - import: (data)/clients/git.yaml
    - import: (data)/common/keep-internet-working.yaml

    # No GeoIP/Thoth dependency - UA/header signatures and static CIDR blocks only.
    - import: (data)/bots/_deny-pathological.yaml
    - import: (data)/meta/ai-block-aggressive.yaml

    - import: (data)/crawlers/_allow-good.yaml

    # A genuine modern browser (Sec-Fetch-*, Sec-Ch-Ua, Accept-Encoding: br/zstd,
    # Upgrade-Insecure-Requests all present) nets a negative weight and skips the
    # challenge. A client that only spoofs the User-Agent string without that
    # header fingerprint lands in the moderate-suspicion tier below.
    - import: (data)/common/acts-like-browser.yaml

    dnsbl: false

    openGraph:
      enabled: true
      considerHost: false
      ttl: 24h

    # CHALLENGE/DENY return HTTP 200: aggressive scrapers stop retrying once
    # they get a 200, but keep hammering on 403/429.
    status_codes:
      CHALLENGE: 200
      DENY: 200

    store:
      backend: memory
      parameters: {}

    thresholds:
      - name: minimal-suspicion
        expression: weight <= 0
        action: ALLOW
      - name: mild-suspicion
        expression:
          all:
            - weight > 0
            - weight < 10
        action: CHALLENGE
        challenge:
          algorithm: metarefresh
          difficulty: 1
      - name: moderate-suspicion
        expression:
          all:
            - weight >= 10
            - weight < 20
        action: CHALLENGE
        challenge:
          algorithm: fast
          difficulty: 2
      - name: mild-proof-of-work
        expression:
          all:
            - weight >= 20
            - weight < 30
        action: CHALLENGE
        challenge:
          algorithm: fast
          difficulty: 4
      - name: extreme-suspicion
        expression: weight >= 30
        action: CHALLENGE
        challenge:
          algorithm: fast
          difficulty: 6
