---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: synapse-psql-v17
  namespace: default
  annotations:
    kyverno.io/ignore: "true"
spec:
  # using only 1 replica: very difficult to drain the node where postgres is running
  # using more than 1 replica: write amplification issues when leveraging replicated storage (e.g. ceph)
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2
  primaryUpdateStrategy: unsupervised
  storage:
    size: 10Gi
    storageClass: rook-ceph-block
  enableSuperuserAccess: true
  superuserSecret:
    name: cloudnative-pg
  postgresql:
    parameters:
      max_connections: "300"
      shared_buffers: 512MB
  monitoring:
    enablePodMonitor: true
  # https://github.com/cloudnative-pg/cloudnative-pg/issues/2570
  enablePDB: false
  resources:
    requests:
      memory: "512Mi"
    limits:
      memory: "2Gi"
  backup:
    retentionPolicy: 7d
    barmanObjectStore:
      wal:
        compression: bzip2
        maxParallel: 4
      destinationPath: s3://postgresql/
      endpointURL: http://minio.kube-system.svc:9000
      serverName: synapse-v17
      s3Credentials:
        accessKeyId:
          name: cloudnative-pg
          key: MINIO_ACCESS_KEY
        secretAccessKey:
          name: cloudnative-pg
          key: MINIO_SECRET_KEY
  # bootstrap:
    # Used to recover a net-new cluster from backups
    # recovery:
    #   source: synapse-psql-backup

    # use to migrate from an existing cnpg cluster to a new cluster
    # initdb:
    #   import:
    #     type: monolith
    #     databases:
    #       - "*"
    #     roles:
    #       - "*"
    #     source:
    #       externalCluster: synapse-psql-v16

  # externalClusters:
    # Represents the backups stored in minio which can be restored from.
    # - name: synapse-psql-backup
    #   barmanObjectStore:
    #     wal:
    #       compression: bzip2
    #       maxParallel: 4
    #     destinationPath: s3://postgresql/
    #     endpointURL: http://minio.kube-system.svc:9000
    #     serverName: synapse-v17
    #     s3Credentials:
    #       accessKeyId:
    #         name: cloudnative-pg
    #         key: MINIO_ACCESS_KEY
    #       secretAccessKey:
    #         name: cloudnative-pg
    #         key: MINIO_SECRET_KEY

    # Represents the previous cluster to migrate from
    # - name: synapse-psql-v16
    #   connectionParameters:
    #     host: synapse-psql-v16-rw.default.svc
    #     user: postgres
    #     dbname: postgres
    #     sslmode: require
    #   password:
    #     name: cloudnative-pg
    #     key: password
---
# Publishes the synapse, synapse-mas, and mautrix-slack databases for
# logical-replication migration to synapse-psql-v18.
# See synapse-v18.yaml for the destination Cluster/Subscriptions.
#
# Prerequisite (done 2026-08-27): every table without a primary key in these
# databases has REPLICA IDENTITY set (USING INDEX where an eligible unique
# index exists, FULL otherwise) - see set-replica-identity.sql. Without this,
# `target.allTables: true` makes Postgres reject UPDATE/DELETE against
# no-PK tables the moment the Publication exists, which caused a production
# outage the first time these were created.
apiVersion: postgresql.cnpg.io/v1
kind: Publication
metadata:
  name: synapse-to-v18
  namespace: default
spec:
  cluster:
    name: synapse-psql-v17
  name: synapse_to_v18
  dbname: synapse
  target:
    allTables: true
---
apiVersion: postgresql.cnpg.io/v1
kind: Publication
metadata:
  name: synapse-mas-to-v18
  namespace: default
spec:
  cluster:
    name: synapse-psql-v17
  name: synapse_mas_to_v18
  dbname: synapse-mas
  target:
    allTables: true
---
apiVersion: postgresql.cnpg.io/v1
kind: Publication
metadata:
  name: mautrix-slack-to-v18
  namespace: default
spec:
  cluster:
    name: synapse-psql-v17
  name: mautrix_slack_to_v18
  dbname: mautrix-slack
  target:
    allTables: true
