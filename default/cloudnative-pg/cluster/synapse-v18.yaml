---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: synapse-psql-v18
  namespace: default
  annotations:
    kyverno.io/ignore: "true"
spec:
  # using only 1 replica: very difficult to drain the node where postgres is running
  # using more than 1 replica: write amplification issues when leveraging replicated storage (e.g. ceph)
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6
  primaryUpdateStrategy: unsupervised
  storage:
    size: 10Gi
    storageClass: rook-ceph-block
  enableSuperuserAccess: true
  superuserSecret:
    name: cloudnative-pg
  postgresql:
    parameters:
      max_connections: "300"
      shared_buffers: 512MB
  monitoring:
    enablePodMonitor: true
  # https://github.com/cloudnative-pg/cloudnative-pg/issues/2570
  enablePDB: false
  resources:
    requests:
      memory: "512Mi"
    limits:
      memory: "2Gi"
  backup:
    retentionPolicy: 7d
    barmanObjectStore:
      wal:
        compression: bzip2
        maxParallel: 4
      destinationPath: s3://postgresql/
      endpointURL: http://minio.kube-system.svc:9000
      serverName: synapse-v18
      s3Credentials:
        accessKeyId:
          name: cloudnative-pg
          key: MINIO_ACCESS_KEY
        secretAccessKey:
          name: cloudnative-pg
          key: MINIO_SECRET_KEY
  bootstrap:
    initdb:
      # Schema/roles only - the Subscriptions below perform the initial data
      # copy and then keep streaming changes so synapse-psql-v17 stays
      # authoritative (and fully writable) until cutover.
      import:
        type: monolith
        schemaOnly: true
        databases:
          - "*"
        roles:
          - "*"
        source:
          externalCluster: synapse-psql-v17

  externalClusters:
    - name: synapse-psql-v17
      connectionParameters:
        host: synapse-psql-v17-rw.default.svc
        user: postgres
        dbname: postgres
        sslmode: require
      password:
        name: cloudnative-pg
        key: password
---
apiVersion: postgresql.cnpg.io/v1
kind: Subscription
metadata:
  name: synapse-from-v17
  namespace: default
spec:
  cluster:
    name: synapse-psql-v18
  name: synapse_from_v17
  dbname: synapse
  externalClusterName: synapse-psql-v17
  # Without this, the replication connection defaults to the externalCluster's
  # dbname (postgres), where the publication doesn't exist - the subscription
  # would silently never sync any data. See the 2026-08-27 incident notes.
  publicationDBName: synapse
  publicationName: synapse_to_v18
---
apiVersion: postgresql.cnpg.io/v1
kind: Subscription
metadata:
  name: synapse-mas-from-v17
  namespace: default
spec:
  cluster:
    name: synapse-psql-v18
  name: synapse_mas_from_v17
  dbname: synapse-mas
  externalClusterName: synapse-psql-v17
  publicationDBName: synapse-mas
  publicationName: synapse_mas_to_v18
---
apiVersion: postgresql.cnpg.io/v1
kind: Subscription
metadata:
  name: mautrix-slack-from-v17
  namespace: default
spec:
  cluster:
    name: synapse-psql-v18
  name: mautrix_slack_from_v17
  dbname: mautrix-slack
  externalClusterName: synapse-psql-v17
  publicationDBName: mautrix-slack
  publicationName: mautrix_slack_to_v18
