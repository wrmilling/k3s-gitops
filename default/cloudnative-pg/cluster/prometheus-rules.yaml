---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudnative-pg-rules
  namespace: default
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: cloudnative-pg.rules
      rules:
        - alert: LongRunningTransaction
          annotations:
            description: Pod {{ $labels.pod }} is taking more than 5 minutes (300 seconds) for a query.
            summary: A query is taking longer than 5 minutes.
          expr: |-
            cnpg_backends_max_tx_duration_seconds > 300
          for: 1m
          labels:
            severity: warning
        - alert: BackendsWaiting
          annotations:
            description: Pod {{ $labels.pod  }} has been waiting for longer than 5 minutes
            summary: If a backend is waiting for longer than 5 minutes
          expr: |-
            cnpg_backends_waiting_total > 300
          for: 1m
          labels:
            severity: warning
        - alert: PGDatabase
          annotations:
            description: Over 1,000,000,000 transactions from frozen xid on pod {{ $labels.pod  }}
            summary: Number of transactions from the frozen XID to the current one
          expr: |-
            cnpg_pg_database_xid_age > 1000000000
          for: 1m
          labels:
            severity: warning
        - alert: PGReplication
          annotations:
            description: Standby is lagging behind by over 300 seconds (5 minutes)
            summary: The standby is lagging behind the primary
          expr: |-
            cnpg_pg_replication_lag > 300
          for: 1m
          labels:
            severity: warning
        # The timestamp is only reported by the instance that took the backup (others
        # report 0), so take the max per cluster.
        - alert: PGBackupStale
          annotations:
            summary: No base backup for {{ $labels.cnpg_cluster }} in 36h.
            description: >-
              The last available base backup for {{ $labels.cnpg_cluster }} is
              {{ $value | humanizeDuration }} old (ScheduledBackups run daily). Check the
              ScheduledBackup, recent Backup objects and the Garage postgresql bucket.
          expr: |
            time() - max by (namespace, cnpg_cluster) (
              label_replace(cnpg_collector_last_available_backup_timestamp, "cnpg_cluster", "$1", "pod", "(.+)-[0-9]+")
            ) > 36 * 3600
          for: 1h
          labels:
            severity: critical
        - alert: PGWalArchivingStalled
          annotations:
            summary: WAL archiving stalled on {{ $labels.pod }}.
            description: >-
              {{ $labels.pod }} has not archived a WAL file for {{ $value | humanizeDuration }}
              (archive_timeout is 5m), so point-in-time recovery is falling behind.
          expr: |
            max by (namespace, pod) (cnpg_pg_stat_archiver_seconds_since_last_archival) > 1800
          for: 15m
          labels:
            severity: critical
        - alert: LastFailedArchiveTime
          annotations:
            description: Archiving failed for {{ $labels.pod }}
            summary: Checks the last time archiving failed. Will be -1 when it has not failed.
          expr: |-
            delta(cnpg_pg_stat_archiver_last_failed_time[5m]) > 0
          for: 1m
          labels:
            severity: warning
        - alert: DatabaseDeadlockConflicts
          annotations:
            description: There are over 10 deadlock conflicts in {{ $labels.pod }}
            summary: Checks the number of database conflicts
          expr: |-
            cnpg_pg_stat_database_deadlocks > 10
          for: 1m
          labels:
            severity: warning
