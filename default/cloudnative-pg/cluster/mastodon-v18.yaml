---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mastodon-psql-v18
  namespace: default
  annotations:
    kyverno.io/ignore: "true"
spec:
  # using only 1 replica: very difficult to drain the node where postgres is running
  # using more than 1 replica: write amplification issues when leveraging replicated storage (e.g. ceph)
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6
  primaryUpdateStrategy: unsupervised
  storage:
    size: 50Gi
    storageClass: rook-ceph-block
  enableSuperuserAccess: true
  superuserSecret:
    name: cloudnative-pg
  postgresql:
    parameters:
      max_connections: "300"
      shared_buffers: 512MB
      # Default (4) is too small once several Publication/Subscription pairs
      # run concurrently during the v17->v18 migration - each subscription
      # needs 1 apply worker plus up to max_sync_workers_per_subscription (2)
      # tablesync workers, so 4 was fully saturated by apply workers alone
      # on shared-psql-v18 (4 subscriptions), stalling all initial table
      # copies. max_worker_processes is 32, leaving plenty of headroom.
      max_logical_replication_workers: "16"
  monitoring:
    enablePodMonitor: true
  # https://github.com/cloudnative-pg/cloudnative-pg/issues/2570
  enablePDB: false
  resources:
    requests:
      memory: "512Mi"
    limits:
      memory: "2Gi"
  backup:
    retentionPolicy: 7d
    barmanObjectStore:
      wal:
        compression: bzip2
        maxParallel: 4
      destinationPath: s3://postgresql/
      endpointURL: http://minio.kube-system.svc:9000
      serverName: mastodon-v18
      s3Credentials:
        accessKeyId:
          name: cloudnative-pg
          key: MINIO_ACCESS_KEY
        secretAccessKey:
          name: cloudnative-pg
          key: MINIO_SECRET_KEY
  bootstrap:
    initdb:
      # Schema/roles only - the Subscription below performs the initial data
      # copy and then keeps streaming changes so mastodon-psql-v17 stays
      # authoritative (and fully writable) until cutover.
      import:
        type: monolith
        schemaOnly: true
        databases:
          - "*"
        roles:
          - "*"
        source:
          externalCluster: mastodon-psql-v17

  externalClusters:
    - name: mastodon-psql-v17
      connectionParameters:
        host: mastodon-psql-v17-rw.default.svc
        user: postgres
        dbname: postgres
        sslmode: require
      password:
        name: cloudnative-pg
        key: password
---
apiVersion: postgresql.cnpg.io/v1
kind: Subscription
metadata:
  name: mastodon-from-v17
  namespace: default
spec:
  cluster:
    name: mastodon-psql-v18
  name: mastodon_from_v17
  dbname: mastodon
  externalClusterName: mastodon-psql-v17
  # Without this, the replication connection defaults to the externalCluster's
  # dbname (postgres), where the publication doesn't exist - the subscription
  # would silently never sync any data. See the 2026-08-27 incident notes.
  publicationDBName: mastodon
  publicationName: mastodon_to_v18
