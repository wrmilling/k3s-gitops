---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-mastodon-garage-pv
  namespace: social
spec:
  storageClassName: mastodon-garage
  capacity:
    storage: 1Mi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 10.10.10.30
    path: "/mnt/tardisk/garage-mastodon"
  mountOptions:
    - nfsvers=4.1
    - tcp
    - intr
    - hard
    - noatime
    - nodiratime
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-mastodon-garage-pvc
  namespace: social
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: mastodon-garage
  resources:
    requests:
      storage: 1Mi
