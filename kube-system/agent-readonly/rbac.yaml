---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-readonly
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-readonly-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: agent-readonly
    namespace: kube-system
---
apiVersion: v1
kind: Secret
metadata:
  name: agent-readonly-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: agent-readonly
type: kubernetes.io/service-account-token
---
# Narrow, read-only escape hatch for querying VictoriaMetrics/VictoriaLogs from
# outside the cluster (kubectl get --raw .../proxy) without granting pods/exec
# or pods/portforward. resourceNames pins this to two named Services; verb
# "get" only permits GET-mapped proxy calls, so writes (e.g. VM remote-write)
# stay blocked even though they share the same Service.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-readonly-monitoring-proxy
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: ["services/proxy"]
    verbs: ["get"]
    # RBAC checks the port-qualified name (e.g. "vmsingle-stack:8428") when a
    # port is given in the proxy URL, not the bare Service name.
    resourceNames:
      - vmsingle-stack
      - vmsingle-stack:8428
      - vmsingle-stack:http
      - victoria-logs-server
      - victoria-logs-server:9428
      - victoria-logs-server:http
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-readonly-monitoring-proxy
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-readonly-monitoring-proxy
subjects:
  - kind: ServiceAccount
    name: agent-readonly
    namespace: kube-system
---
# Nodes are cluster-scoped, so the built-in "view" ClusterRole (which only
# aggregates namespaced-resource rules) doesn't cover them. Grants read-only
# node status/capacity for health checks, plus the metrics.k8s.io "nodes"
# resource for `kubectl top nodes`. Deliberately excludes nodes/proxy
# (kubelet API) — not needed to read status and a much bigger blast radius.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-readonly-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-readonly-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-readonly-nodes
subjects:
  - kind: ServiceAccount
    name: agent-readonly
    namespace: kube-system
---
# Rook-Ceph's CRDs (ceph.rook.io group) aren't aggregated into the built-in
# "view" role either. Grants read on the CRs that carry cluster/pool/fs/
# object-store health for a healthcheck, scoped to the rook-ceph namespace
# where they live.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-readonly-rook-ceph
  namespace: rook-ceph
rules:
  - apiGroups: ["ceph.rook.io"]
    resources:
      - cephclusters
      - cephblockpools
      - cephfilesystems
      - cephobjectstores
      - cephclients
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-readonly-rook-ceph
  namespace: rook-ceph
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-readonly-rook-ceph
subjects:
  - kind: ServiceAccount
    name: agent-readonly
    namespace: kube-system
