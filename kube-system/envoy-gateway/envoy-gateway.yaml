---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: kube-system
spec:
  chart:
    spec:
      # renovate: registryUrl=oci://mirror.gcr.io/envoyproxy
      chart: gateway-helm
      version: 1.9.1
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway-charts
        namespace: flux-system
      interval: 1h
  interval: 30m
  install:
    createNamespace: true
  values:
    # v1.9.0 moved this ValidatingAdmissionPolicy from the chart's crds/ bundle into
    # templates/; unused in this repo, so skip rendering it rather than depend on Helm
    # ownership annotations continuing to line up across the crds/->templates/ move.
    # See https://gateway.envoyproxy.io/news/releases/notes/v1.9.0/
    crds:
      gatewayAPI:
        safeUpgradePolicy:
          enabled: false
    config:
      envoyGateway:
        gateway:
          controllerName: gateway.envoyproxy.io/gatewayclass-controller
        extensionApis:
          enableBackend: true
          enableEnvoyPatchPolicy: true
          enableEnvoyProxy: true
          enableSecurityPolicy: true
          enableBackendTrafficPolicy: true
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              type: GatewayNamespace
    global:
      imageRegistry: mirror.gcr.io
