---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: kube-system
spec:
  chart:
    spec:
      # renovate: registryUrl=oci://mirror.gcr.io/envoyproxy
      chart: gateway-helm
      version: v1.8.3
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway-charts
        namespace: flux-system
      interval: 1h
  interval: 30m
  install:
    createNamespace: true
  values:
    config:
      envoyGateway:
        gateway:
          controllerName: gateway.envoyproxy.io/gatewayclass-controller
        extensionApis:
          enableBackend: true
          enableEnvoyPatchPolicy: true
          enableEnvoyProxy: true
          enableSecurityPolicy: true
          enableBackendTrafficPolicy: true
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              type: GatewayNamespace
    global:
      imageRegistry: mirror.gcr.io
